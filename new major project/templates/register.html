{% extends "base.html" %}
{% block title %}{{ t('register_title') }} — CervixGuard AI{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="card">
    <span class="ribbon"></span>
    <h1 style="font-size:22px;">{{ t('register_title') }}</h1>
    <p>{{ t('register_sub') }}</p>
    <form method="post" style="text-align:left; margin-top:20px;">
      <div class="field">
        <label>{{ t('username_label') }}</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="field">
        <label>{{ t('password_label') }}</label>
        <input type="password" name="password" required minlength="4">
      </div>
      <div class="field">
        <label>{{ t('email_label') }}</label>
        <input type="email" name="email">
        <p class="field-help">{{ t('email_help_register') }}</p>
      </div>
      <button type="submit" class="btn btn-primary btn-block">{{ t('btn_register') }}</button>
    </form>
    <p style="margin-top:18px; font-size:13.5px;">
      <a href="{{ url_for('login') }}">{{ t('nav_login') }}</a>
    </p>
  </div>
</div>
{% endblock %}
