{% extends "base.html" %}
{% block title %}{{ t('login_title') }} — CervixGuard AI{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="card">
    <span class="ribbon"></span>
    <h1 style="font-size:22px;">{{ t('login_title') }}</h1>
    <p>{{ t('login_sub') }}</p>
    <form method="post" style="text-align:left; margin-top:20px;">
      <div class="field">
        <label>{{ t('username_label') }}</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="field">
        <label>{{ t('password_label') }}</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">{{ t('btn_login') }}</button>
    </form>
    <p style="margin-top:18px; font-size:13.5px;">
      <a href="{{ url_for('register') }}">{{ t('nav_register') }}</a>
    </p>
  </div>
</div>
{% endblock %}
